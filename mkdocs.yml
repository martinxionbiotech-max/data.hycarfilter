site_name: Hycarfilter Data
site_description: >-
  Canonical product database for hycarfilter — structured specs, cross-references
  and export packing data. Machine-readable, zero marketing.
site_url: https://data.hycarfilter.com
repo_url: https://github.com/martinxionbiotech-max/data.hycarfilter
repo_name: data.hycarfilter

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search

extra:
  version: 0.1.0

nav:
  - Home: index.md
  - SKU Index: products/index.md
  - Categories:
      - Air Filter: products/air-filter.md
      - Cabin Filter: products/cabin-filter.md
      - Oil Filter: products/oil-filter.md
      - Fuel Filter: products/fuel-filter.md
      - Wiper Blade: products/wiper-blade.md
      - Transmission Filter Screen: products/transmission-filter-screen.md
      - LED Lights: products/led-lights.md
  - SKU Details:
      - Air Filter:
          - hy-af-nano: products/hy-af-nano.md
          - hy-af-panel: products/hy-af-panel.md
          - hy-af-round: products/hy-af-round.md
          - hy-af-heavy: products/hy-af-heavy.md
      - Cabin Filter:
          - hy-cf-particle: products/hy-cf-particle.md
          - hy-cf-carbon: products/hy-cf-carbon.md
          - hy-cf-hepa: products/hy-cf-hepa.md
      - Oil Filter:
          - hy-of-spinon: products/hy-of-spinon.md
          - hy-of-cartridge: products/hy-of-cartridge.md
          - hy-of-hd: products/hy-of-hd.md
          - hy-of-longlife: products/hy-of-longlife.md
      - Fuel Filter:
          - hy-ff-spinon: products/hy-ff-spinon.md
          - hy-ff-inline: products/hy-ff-inline.md
          - hy-ff-water: products/hy-ff-water.md
      - Wiper Blade:
          - hy-wb-beam: products/hy-wb-beam.md
          - hy-wb-hybrid: products/hy-wb-hybrid.md
          - hy-wb-rear: products/hy-wb-rear.md
      - Transmission Filter Screen:
          - hy-tf-pan: products/hy-tf-pan.md
          - hy-tf-kit: products/hy-tf-kit.md
      - LED Lights:
          - hy-led-h4: products/hy-led-h4.md
          - hy-led-h7: products/hy-led-h7.md
          - hy-led-bar: products/hy-led-bar.md
  - Cross-References:
      - Vehicle Fitment: crossref/vehicle-fitment.md
      - Fitment Completeness: crossref/fitment-completeness.md
      - OE Cross-Reference: crossref/oe-cross-reference.md
      - Export Packing: crossref/export-packing.md
  - Data Specification:
      - Field Schema: specification/field-schema.md
      - Naming Rules: specification/naming-rules.md
      - Changelog: specification/changelog.md
